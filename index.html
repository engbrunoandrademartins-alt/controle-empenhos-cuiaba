<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Controle de Empenhos — Prefeitura Municipal de Cuiabá</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<style>
:root{
  --navy:#0E3B2D; --navy-2:#14503D; --blue:#1F7A5C; --blue-dk:#175F47;
  --amber:#D98E2D; --green:#3E8E5A; --red:#C1443C;
  --bg:#F3F7F4; --panel:#FFFFFF; --line:#DCE7E0; --ink:#16202E; --ink-2:#4B5768; --ink-3:#8592A3;
  --mono:'IBM Plex Mono',ui-monospace,monospace; --sans:'Inter',-apple-system,sans-serif; --radius:6px;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{font-family:var(--sans);background:var(--bg);color:var(--ink);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased;}
#topbar{background:var(--navy);color:#fff;padding:16px 26px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:20;}
#topbar .brand{display:flex;align-items:center;gap:10px;}
#topbar h1{font-size:17px;margin:0;font-weight:800;}
#topbar .sub{font-size:11.5px;color:#9FC4B0;font-family:var(--mono);}
#topbar .actions{display:flex;gap:8px;}
#breadcrumb{background:#fff;border-bottom:1px solid var(--line);padding:10px 26px;font-size:12.6px;color:var(--ink-2);display:flex;gap:6px;align-items:center;}
#breadcrumb a{color:var(--blue-dk);text-decoration:none;cursor:pointer;font-weight:600;}
#content{padding:22px 26px 60px;max-width:1400px;margin:0 auto;}
button,.btn{font-family:var(--sans);font-size:13px;font-weight:600;border-radius:5px;border:1px solid var(--line);background:#fff;color:var(--ink);padding:8px 14px;cursor:pointer;transition:.12s;}
button:hover{border-color:var(--ink-3);}
.btn-primary{background:var(--blue);border-color:var(--blue-dk);color:#fff;}
.btn-primary:hover{background:var(--blue-dk);}
.btn-danger{background:#fff;border-color:var(--red);color:var(--red);}
.btn-danger:hover{background:var(--red);color:#fff;}
.btn-ghost{background:transparent;border-color:transparent;color:#CFE7DA;}
.btn-ghost:hover{background:rgba(255,255,255,.1);border-color:transparent;}
.btn-sm{padding:5px 9px;font-size:12px;}
.grid{display:grid;gap:14px;}
.cols-4{grid-template-columns:repeat(4,1fr);}
.cols-3{grid-template-columns:repeat(3,1fr);}
.cols-2{grid-template-columns:repeat(2,1fr);}
@media(max-width:1000px){.cols-4{grid-template-columns:repeat(2,1fr);}.cols-3{grid-template-columns:repeat(2,1fr);}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;}
.kpi .label{font-size:11.5px;color:var(--ink-3);text-transform:uppercase;letter-spacing:.06em;font-weight:600;}
.kpi .value{font-family:var(--mono);font-size:22px;font-weight:600;margin-top:6px;color:var(--navy);}
.kpi .value.blue{color:var(--blue-dk);} .kpi .value.green{color:var(--green);} .kpi .value.amber{color:var(--amber);} .kpi .value.red{color:var(--red);}
.kpi .bar{height:6px;background:var(--line);border-radius:4px;margin-top:10px;overflow:hidden;}
.kpi .bar>div{height:100%;background:var(--blue);}
.panel-title{font-size:14.5px;font-weight:700;margin:0 0 12px;display:flex;align-items:center;justify-content:space-between;}
.table-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--radius);}
table.dt{width:100%;border-collapse:collapse;font-size:12.6px;background:#fff;}
table.dt th{background:#F0F3F8;text-align:left;padding:8px 10px;font-weight:600;color:var(--ink-2);border-bottom:1px solid var(--line);white-space:nowrap;font-size:11.3px;text-transform:uppercase;letter-spacing:.03em;}
table.dt td{padding:7px 10px;border-bottom:1px solid #EDF0F5;vertical-align:middle;}
table.dt tr:last-child td{border-bottom:none;}
table.dt tr:hover td{background:#FAFBFD;}
table.dt td.num,table.dt th.num{text-align:right;font-family:var(--mono);}
table.dt tfoot td{font-weight:700;background:#F7F9FC;border-top:2px solid var(--line);font-family:var(--mono);}
.empty-row td{text-align:center;color:var(--ink-3);padding:22px;font-style:italic;}
.tag{display:inline-block;padding:2px 8px;border-radius:10px;font-size:10.8px;font-weight:700;background:#EAF1FB;color:var(--blue-dk);text-transform:uppercase;}
.tag.green{background:#E7F5EC;color:var(--green);} .tag.amber{background:#FBF1E3;color:var(--amber);} .tag.red{background:#FBEBEA;color:var(--red);} .tag.gray{background:#EEF1F5;color:var(--ink-3);}
.row-actions{display:flex;gap:4px;justify-content:flex-end;white-space:nowrap;}
.form-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px 16px;}
.form-grid.c3{grid-template-columns:repeat(3,1fr);}
.field{display:flex;flex-direction:column;gap:5px;}
.field.span2{grid-column:span 2;}
.field label{font-size:11.3px;font-weight:600;color:var(--ink-2);text-transform:uppercase;letter-spacing:.03em;}
.field input,.field select,.field textarea{padding:8px 10px;border:1px solid var(--line);border-radius:5px;font-size:13.3px;font-family:var(--sans);background:#fff;color:var(--ink);}
.field input:focus,.field select:focus,.field textarea:focus{outline:2px solid var(--blue);outline-offset:-1px;border-color:var(--blue);}
#modal-backdrop{position:fixed;inset:0;background:rgba(10,16,26,.5);display:none;align-items:flex-start;justify-content:center;z-index:100;overflow-y:auto;padding:40px 16px;}
#modal-backdrop.open{display:flex;}
.modal{background:#fff;border-radius:8px;width:100%;max-width:760px;box-shadow:0 20px 60px rgba(0,0,0,.25);}
.modal.wide{max-width:1080px;}
.modal-head{padding:16px 20px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;}
.modal-head h3{margin:0;font-size:16px;}
.modal-body{padding:18px 20px;max-height:74vh;overflow-y:auto;}
.modal-foot{padding:14px 20px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px;}
.modal-close{cursor:pointer;color:var(--ink-3);font-size:20px;background:none;border:none;padding:0 4px;}
.note-box{background:#EEF4FC;border:1px solid #CFE1F5;border-radius:6px;padding:10px 14px;font-size:12.4px;color:var(--navy-2);}
.subcard{background:#FAFBFD;border:1px solid var(--line);border-radius:6px;padding:12px 14px;margin-top:10px;}
.flex-between{display:flex;justify-content:space-between;align-items:center;gap:10px;}
.toast-wrap{position:fixed;bottom:20px;right:20px;z-index:200;display:flex;flex-direction:column;gap:8px;}
.toast{background:var(--navy);color:#fff;padding:10px 16px;border-radius:6px;font-size:13px;box-shadow:0 8px 24px rgba(0,0,0,.2);}
.toast.err{background:var(--red);}
.link-btn{background:none;border:none;color:var(--blue-dk);font-weight:600;cursor:pointer;padding:0;text-decoration:underline;}
.contract-card{background:#fff;border:1px solid var(--line);border-radius:8px;padding:16px 18px;cursor:pointer;transition:.12s;}
.contract-card:hover{border-color:var(--blue);box-shadow:0 4px 14px rgba(31,122,92,.15);}
.contract-card h3{margin:0 0 2px;font-size:15px;}
.contract-card .cnpj{font-size:11.5px;color:var(--ink-3);font-family:var(--mono);}
.editable-cell input{width:100%;border:1px solid transparent;background:transparent;padding:3px 4px;font-family:var(--mono);font-size:12.4px;border-radius:3px;}
.editable-cell input:focus{border-color:var(--blue);background:#fff;outline:none;}
.group-block{border:1px solid var(--line);border-radius:8px;margin-bottom:14px;overflow:hidden;}
.group-head{background:#F0F3F8;padding:10px 14px;display:flex;justify-content:space-between;align-items:center;font-weight:700;font-size:13px;}
.small-muted{font-size:11.3px;color:var(--ink-3);}
::-webkit-scrollbar{width:10px;height:10px;} ::-webkit-scrollbar-thumb{background:#C7D0DC;border-radius:6px;}
</style>
</head>

async function fetchAllData(){

        }))

}

/* ---------- Realtime: avisa quando outro colega mudou algo ---------- */
function setupRealtime(){
  const tables = ['emp_contratos','emp_aditivos','emp_grupos','emp_empenhos','emp_medicoes','emp_notas'];
  const channel = sb.channel('emp-changes');
  tables.forEach(t=> channel.on('postgres_changes', {event:'*', schema:'public', table:t}, ()=>{
    if(Date.now() - lastLocalWriteAt < 1200) return; // eco da própria escrita
    showUpdateBanner();
  }));
  channel.subscribe();
}
function showUpdateBanner(){
  if(document.getElementById('update-banner')) return;
  const b = document.createElement('div');
  b.id='update-banner';
  b.style.cssText='position:fixed;top:0;left:0;right:0;background:var(--amber);color:#fff;text-align:center;padding:9px;z-index:300;font-weight:700;cursor:pointer;font-size:13px;';
  b.textContent = '⟳ Um colega atualizou os dados agora — clique para recarregar';
  b.onclick = async ()=>{ b.remove(); await fetchAllData(); render(); toast('Dados atualizados.'); };
  document.body.prepend(b);
}

function fmtMoney(v){ v=Number(v)||0; return v.toLocaleString('pt-BR',{style:'currency',currency:'BRL'}); }
function fmtNum(v,c){ c=c===undefined?2:c; v=Number(v)||0; return v.toLocaleString('pt-BR',{minimumFractionDigits:c,maximumFractionDigits:c}); }
function fmtPct(v){ return fmtNum(v,1)+'%'; }
function esc(s){ return (s===undefined||s===null)?'':String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function toNumSafe(v){
  if(v===''||v===undefined||v===null) return 0;
  if(typeof v === 'number') return v;
  let s = String(v).trim().replace(/^R\$\s*/i,'');
  if(s.indexOf(',')>=0){ s = s.replace(/\./g,'').replace(',', '.'); }
  const n = parseFloat(s);
  return isNaN(n)?0:n;
}
function toNum(v){ return toNumSafe(v); }
function toDateBR(v){
  if(!v) return '';
  if(typeof v === 'number'){ // serial excel
    const d = new Date(Math.round((v-25569)*86400*1000));
    return d.toLocaleDateString('pt-BR');
  }
  const s = String(v);
  const d = new Date(s);
  if(!isNaN(d.getTime()) && /^\d{4}-\d{2}-\d{2}/.test(s)) return d.toLocaleDateString('pt-BR');
  return s;
}

function buildFields(fields, data){

    const val = data[f.key]!==undefined?data[f.key]:(f.default!==undefined?f.default:'');
    const span = f.span2?' span2':'';
    let input='';
    if(f.type==='select'){
      input = '<select id="fld_'+f.key+'">'+f.options.map(o=>{
        const ov=(typeof o==='object')?o.value:o, ol=(typeof o==='object')?o.label:o;
        return '<option value="'+esc(ov)+'" '+(String(val)===String(ov)?'selected':'')+'>'+esc(ol)+'</option>';
      }).join('')+'</select>';
    } else if(f.type==='textarea'){
      input = '<textarea id="fld_'+f.key+'" placeholder="'+esc(f.placeholder||'')+'">'+esc(val)+'</textarea>';
    } else {
      input = '<input type="'+(f.type||'text')+'" id="fld_'+f.key+'" value="'+esc(val)+'" placeholder="'+esc(f.placeholder||'')+'" '+(f.step?'step="'+f.step+'"':'')+'>';
    }

/* Parser dinâmico da "Planilha de Contratos" -> baseado em cabeçalhos reais da linha, não em posições fixas.
   Funciona tanto no browser (com window.XLSX) quanto no Node (para testes) */
(function(root){

function normHeader(s){ return String(s===undefined||s===null?'':s).trim().toUpperCase().replace(/\s+/g,' '); }
function toNumBR(v){
  if(v===undefined||v===null||v==='') return undefined;
  if(typeof v === 'number') return v;
  let s = String(v).trim();
  if(!s) return undefined;
  s = s.replace(/^R\$\s*/i,'').replace(/\./g,'').replace(',', '.').replace(/[^\d.\-]/g,'');
  const n = parseFloat(s);
  return isNaN(n) ? undefined : n;
}
function toDateStr(v){
  if(v===undefined||v===null||v==='') return '';
  if(v instanceof Date) return v.toISOString().slice(0,10);
  return String(v).trim();
}
function cellStr(v){ return v===undefined||v===null?'':String(v).trim(); }

const HEADER_FIELD_MAP = {
  'NÚMERO DO EMPENHO':'numero','NUMERO DO EMPENHO':'numero',
  'DATA DE EMISSÃO':'DATA_EMISSAO', 'DATA DE EMISSAO':'DATA_EMISSAO',
  'VALOR DO EMPENHO':'valorEmpenho',
  'NF':'nf','NUMERO DA NOTA FISCAL':'nf','NÚMERO DA NOTA FISCAL':'nf',
  'LOCAL':'local','LOCAL / MES':'local','LOCAL/MES':'local','LOCAL / MÊS':'local',
  'SGD':'sgd',
  'STATUS':'status',
  'VALOR DA NF':'valorNF','VALOR DA NOTA FISCAL':'valorNF',
  'UTILIZADO':'utilizado',
  'SALDO':'saldo',
  'FINANCEIRO PAGO':'financeiroPago'
};

function isEmpenhoHeaderRow(row){
  return row.some(c => normHeader(c) === 'NÚMERO DO EMPENHO' || normHeader(c) === 'NUMERO DO EMPENHO');
}

function buildColMap(row){
  const map = {}; let sawDataEmissao = false;
  row.forEach((cell, idx)=>{
    const h = normHeader(cell);
    if(!h) return;
    if(HEADER_FIELD_MAP[h]){
      let field = HEADER_FIELD_MAP[h];
      if(field === 'DATA_EMISSAO'){
        field = sawDataEmissao ? 'dataNF' : 'dataEmpenho';
        sawDataEmissao = true;
      }
      map[field] = idx;
    }
  });
  return map;
}
function rowIsBlank(row){ return !row || row.every(c => cellStr(c)===''); }
function rowHasTotal(row){ return row.some(c => normHeader(c).indexOf('TOTAL')===0); }

function findLabelValue(row, label){
  const idx = row.findIndex(c => normHeader(c) === label);
  if(idx<0) return '';
  for(let k=idx+1;k<row.length;k++){ if(cellStr(row[k])!=='') return cellStr(row[k]); }
  return '';
}
function findLabelStartsValue(row, prefix){
  const idx = row.findIndex(c => normHeader(c).indexOf(prefix) === 0);
  if(idx<0) return '';
  for(let k=idx+1;k<row.length;k++){ if(cellStr(row[k])!=='') return cellStr(row[k]); }
  return '';
}
function parseContratoSheet(sheetName, aoa){
  // aoa = array of arrays (rows), 0-indexed. Posição das colunas varia entre abas -> tudo localizado por texto do cabeçalho.
  const contrato = { nomeAba: sheetName, credor:'', cnpj:'', numeroContrato:'', objeto:'', vigenciaInicial:'', valorInicial:0, aditivos:[], grupos:[] };
  let i = 0;
  const N = aoa.length;
  // 1) Cabecalho credor/cnpj/contrato: procura o rotulo em qualquer coluna, nas primeiras 20 linhas
  for(i=0;i<Math.min(N,20);i++){
    const row = aoa[i] || [];
    const v1 = findLabelValue(row, 'CREDOR:'); if(v1) contrato.credor = v1;
    const v2 = findLabelValue(row, 'CNPJ:'); if(v2) contrato.cnpj = v2;
    const v3 = findLabelValue(row, 'CONTRATO:'); if(v3) contrato.numeroContrato = v3;
    const v4 = findLabelStartsValue(row, 'OBJETO'); if(v4) contrato.objeto = v4;
  }
  // 2) Bloco "CONTROLE DE SALDO DE CONTRATO": acha a linha de cabecalho com "VALOR DO CONTRATO"
  let headerIdx = -1, colContrato=-1, colVigencia=-1, colValor=-1;
  for(i=0;i<N;i++){
    const row = aoa[i]||[];
    const idxValor = row.findIndex(c=>normHeader(c)==='VALOR DO CONTRATO');
    if(idxValor>=0){
      headerIdx = i; colValor = idxValor;
      colContrato = row.findIndex(c=>normHeader(c)==='CONTRATO');
      colVigencia = row.findIndex(c=>normHeader(c).indexOf('VIGÊNCIA')===0 || normHeader(c).indexOf('VIGENCIA')===0);
      break;
    }
  }
  let empenhoSectionStart = N;
  if(headerIdx>=0){
    const baseRow = aoa[headerIdx+1]||[];
    contrato.vigenciaInicial = colVigencia>=0 ? toDateStr(baseRow[colVigencia]) : '';
    contrato.valorInicial = colValor>=0 ? (toNumBR(baseRow[colValor]) || 0) : 0;
    // aditivos: da linha seguinte ate achar secao de empenho ou 50 linhas
    let j = headerIdx+2;
    for(; j < Math.min(N, headerIdx+50); j++){
      const row = aoa[j]||[];
      const joinedUpper = row.map(normHeader).join(' ');
      if(joinedUpper.indexOf('CONTROLE DE SALDO DE EMPENHO')>=0 || joinedUpper.indexOf('NÚMERO DO EMPENHO')>=0 || joinedUpper.indexOf('NUMERO DO EMPENHO')>=0){
        empenhoSectionStart = j; break;
      }
      const label = colContrato>=0 ? cellStr(row[colContrato]) : '';
      if(label && normHeader(label)!=='TOTAL'){
        // observação: primeira célula de texto não numérica após a coluna de valor, que não seja data
        let obs = '';
        for(let k=(colValor>=0?colValor+1:0); k<row.length; k++){
          const cs = cellStr(row[k]);
          if(cs!=='' && isNaN(toNumBR(cs))){ obs = cs; break; }
        }
        contrato.aditivos.push({
          id: 'ADT-'+j,
          label: label,
          data: colVigencia>=0 ? toDateStr(row[colVigencia]) : '',
          valor: colValor>=0 ? toNumBR(row[colValor]) : undefined,
          observacao: obs
        });
      }
      empenhoSectionStart = j+1;
    }
  }
  // 3) Blocos de empenho: varre o resto da planilha por linhas de cabecalho dinamico
  let currentGrupo = null;
  let currentEmpenho = null;
  for(i = empenhoSectionStart; i < N; i++){
    const row = aoa[i] || [];
    if(rowIsBlank(row)) continue;
    if(isEmpenhoHeaderRow(row)){
      const colMap = buildColMap(row);
      i++;
      for(; i<N; i++){
        const r2 = aoa[i] || [];
        if(rowIsBlank(r2)) continue;
        if(isEmpenhoHeaderRow(r2)){ i--; break; } // proximo bloco: deixa loop externo tratar
        const joined = r2.map(normHeader).join(' ');
        if(joined.indexOf('CONTROLE DE SALDO DE EMPENHO')>=0){ i--; break; }
        if(rowHasTotal(r2)) continue; // linha de total do bloco: ignora, recalculado no app
        let numero = colMap.numero!==undefined ? cellStr(r2[colMap.numero]) : '';
        if(numero && !/^[0-9][0-9.\/\- ]*[0-9]$|^[0-9]+$/.test(numero.trim())) numero = ''; // descarta rótulos como "SALDO DE EMPENHO", "RENOVAÇÃO...", etc.
        const nf = colMap.nf!==undefined ? cellStr(r2[colMap.nf]) : '';
        const tipoColIdx = colMap.numero!==undefined ? colMap.numero-1 : -1;
        const tipoCell = tipoColIdx>=0 ? cellStr(r2[tipoColIdx]) : '';
        if(numero){
          currentGrupo = contrato.grupos.find(g=>g.tipo === (tipoCell||'GERAL'));
          if(!currentGrupo){ currentGrupo = {id:'GRP-'+contrato.grupos.length, tipo: tipoCell || 'GERAL', empenhos:[]}; contrato.grupos.push(currentGrupo); }
          currentEmpenho = {
            id:'EMP-'+i, numero: numero,
            dataEmissao: colMap.dataEmpenho!==undefined ? toDateStr(r2[colMap.dataEmpenho]) : '',
            valor: (colMap.valorEmpenho!==undefined ? toNumBR(r2[colMap.valorEmpenho]) : 0) || 0,
            statusOverride: normHeader(tipoCell)==='ANULADO' ? 'ANULADO' : '',
            notas: []
          };
          currentGrupo.empenhos.push(currentEmpenho);
          if(nf && currentEmpenho){
            currentEmpenho.notas.push({
              id:'NF-'+i, nf: nf,
              local: colMap.local!==undefined?cellStr(r2[colMap.local]):'',
              sgd: colMap.sgd!==undefined?cellStr(r2[colMap.sgd]):'',
              status: colMap.status!==undefined?cellStr(r2[colMap.status]):'',
              valorNF: (colMap.valorNF!==undefined?toNumBR(r2[colMap.valorNF]):0) || 0
            });
          }
        } else if(nf && currentEmpenho){
          currentEmpenho.notas.push({
            id:'NF-'+i, nf: nf,
            local: colMap.local!==undefined?cellStr(r2[colMap.local]):'',
            sgd: colMap.sgd!==undefined?cellStr(r2[colMap.sgd]):'',
            status: colMap.status!==undefined?cellStr(r2[colMap.status]):'',
            valorNF: (colMap.valorNF!==undefined?toNumBR(r2[colMap.valorNF]):0) || 0
          });
        }
      }
    }
  }
  return contrato;
}

function parseWorkbook(XLSXlib, workbook){
  const out = [];
  workbook.SheetNames.forEach(name=>{
    const ws = workbook.Sheets[name];
    const aoa = XLSXlib.utils.sheet_to_json(ws, {header:1, defval:'', raw:true});
    const c = parseContratoSheet(name, aoa);
    out.push(c);
  });
  return out;
}

/* =========================================================================
   CÁLCULOS DE SALDO
   ========================================================================= */
function empenhoAllNotas(e){
  const out = [];
  (e.medicoes||[]).forEach(m=> (m.notas||[]).forEach(n=> out.push(n)) );
  return out;
}
function empenhoUtilizado(e){ return empenhoAllNotas(e).reduce((s,n)=>s+toNum(n.valorNF),0); }
function empenhoFinanceiroPago(e){ return empenhoAllNotas(e).reduce((s,n)=> s + (normStatus(n.status)==='PAGO' ? toNum(n.valorNF) : 0), 0); }
function medicaoTotal(m){ return (m.notas||[]).reduce((s,n)=>s+toNum(n.valorNF),0); }
function empenhoSaldo(e){
  if(isAnulado(e)) return 0;
  return toNum(e.valor) - empenhoUtilizado(e);
}
function isAnulado(e){ return normStatus(e.statusOverride)==='ANULADO'; }
function normStatus(s){ return String(s||'').trim().toUpperCase(); }

function contratoValorTotal(c){
  return toNum(c.valorInicial) + (c.aditivos||[]).reduce((s,a)=> s + (a.valor!==undefined && a.valor!==null && a.valor!=='' ? toNum(a.valor) : 0), 0);
}
function contratoTotais(c){
  let totalEmpenhado=0, totalUtilizado=0, totalPago=0, totalSaldoEmpenho=0;
  (c.grupos||[]).forEach(g=>{
    (g.empenhos||[]).forEach(e=>{
      const anulado = isAnulado(e);
      const util = empenhoUtilizado(e);
      const pago = empenhoFinanceiroPago(e);
      if(!anulado){ totalEmpenhado += toNum(e.valor); totalUtilizado += util; totalSaldoEmpenho += empenhoSaldo(e); }
      totalPago += pago;
    });
  });
  const valorTotal = contratoValorTotal(c);
  const saldoContrato = valorTotal - totalEmpenhado;
  return { valorTotal, totalEmpenhado, totalUtilizado, totalPago, totalSaldoEmpenho, saldoContrato,
           pctComprometido: valorTotal>0 ? (totalEmpenhado/valorTotal*100) : 0,
           pctUtilizado: totalEmpenhado>0 ? (totalUtilizado/totalEmpenhado*100) : 0 };
}
function contratoLabel(c){ return (c.numeroContrato||'(sem número)') + (c.credor? ' — '+c.credor : ''); }
function contratoKey(c){
  const num = (c.numeroContrato||'').trim().toUpperCase().replace(/\s+/g,'');
  if(num) return 'NUM:'+num;
  return 'SEMNUM:'+(c.credor||'').trim().toUpperCase()+':'+toNum(c.valorInicial);
}
function contratoJaExiste(c){ return DB.contratos.some(x=>contratoKey(x)===contratoKey(c)); }
function contratoEmpenhoCount(c){ return (c.grupos||[]).reduce((s,g)=>s+(g.empenhos||[]).length,0); }
function findDuplicateGroups(){
  const map = {};
  DB.contratos.forEach(c=>{ const k=contratoKey(c); if(!map[k]) map[k]=[]; map[k].push(c); });
  return Object.values(map).filter(arr=>arr.length>1);
}

  const totalGeral = DB.contratos.reduce((s,c)=>s+contratoTotais(c).valorTotal,0);
  const totalEmpenhadoGeral = DB.contratos.reduce((s,c)=>s+contratoTotais(c).totalEmpenhado,0);
  const totalSaldoGeral = DB.contratos.reduce((s,c)=>s+contratoTotais(c).saldoContrato,0);
  const totalPagoGeral = DB.contratos.reduce((s,c)=>s+contratoTotais(c).totalPago,0);

  const cards = DB.contratos.map(c=>{
    const t = contratoTotais(c);
    const pct = Math.min(100, t.pctComprometido);
    const corBar = pct>90 ? 'var(--red)' : (pct>70 ? 'var(--amber)' : 'var(--blue)');
    return `<div class="contract-card" onclick="goContrato('${c.id}')">
      <div class="flex-between">
        <div><h3>${esc(c.numeroContrato)||'(sem número)'}</h3><div class="cnpj">${esc(c.cnpj)||'CNPJ não informado'}</div></div>
        <span class="tag ${pct>90?'red':(pct>70?'amber':'')}">${fmtPct(pct)} comprometido</span>
      </div>
      <p style="margin:8px 0 10px;font-size:13px;color:var(--ink-2);">${esc(c.credor)||'Credor não informado'}</p>
      <div class="grid cols-3" style="gap:8px;">
        <div><div class="small-muted">Valor do contrato</div><div style="font-family:var(--mono);font-weight:600;">${fmtMoney(t.valorTotal)}</div></div>
        <div><div class="small-muted">Empenhado</div><div style="font-family:var(--mono);font-weight:600;">${fmtMoney(t.totalEmpenhado)}</div></div>
        <div><div class="small-muted">Saldo do contrato</div><div style="font-family:var(--mono);font-weight:600;color:${t.saldoContrato<0?'var(--red)':'var(--green)'}">${fmtMoney(t.saldoContrato)}</div></div>
      </div>
      <div class="kpi"><div class="bar"><div style="width:${pct}%;background:${corBar};"></div></div></div>
    </div>`;
  }).join('') || `<div class="note-box">Nenhum contrato cadastrado. Clique em "+ Novo contrato" ou importe sua planilha de contratos.</div>`;

  const dupGroups = findDuplicateGroups();
  const dupWarning = dupGroups.length ? `<div class="note-box" style="margin-bottom:14px;border-color:#F0C36B;background:#FBF1E3;">
      ⚠ Encontrados ${dupGroups.length} contrato(s) com cópias duplicadas. <button class="link-btn" style="font-size:12.4px;" onclick="duplicadosForm()">Resolver agora</button>
    </div>` : '';

  document.getElementById('content').innerHTML = `
  ${dupWarning}
  <div class="grid cols-4" style="margin-bottom:18px;">
    ${kpi('Contratos ativos', DB.contratos.length, '')}
    ${kpi('Valor total (todos)', fmtMoney(totalGeral), 'blue')}
    ${kpi('Total empenhado', fmtMoney(totalEmpenhadoGeral), 'amber')}
    ${kpi('Saldo total dos contratos', fmtMoney(totalSaldoGeral), totalSaldoGeral<0?'red':'green')}
  </div>
  <div class="grid cols-3" id="contratos-grid">${cards}</div>`;
}
function kpi(label,value,cls){ return `<div class="card kpi"><div class="label">${esc(label)}</div><div class="value ${cls||''}">${value}</div></div>`; }

/* =========================================================================
   DETECÇÃO E LIMPEZA DE CONTRATOS DUPLICADOS
   ========================================================================= */
let __DUP_GROUPS__ = [];
function duplicadosForm(){
  const groups = findDuplicateGroups();
  if(!groups.length){ toast('Nenhum contrato duplicado encontrado.'); return; }
  __DUP_GROUPS__ = groups;
  const html = groups.map((grp,gi)=>{
    // sugere manter o que tem mais empenhos lançados (provavelmente o mais completo)
    let defaultIdx = 0, maxEmp = -1;
    grp.forEach((c,ci)=>{ const n = contratoEmpenhoCount(c); if(n>=maxEmp){ maxEmp=n; defaultIdx=ci; } });
    const rows = grp.map((c,ci)=>{
      const empCount = contratoEmpenhoCount(c);
      return `<tr>
        <td><input type="radio" name="dup-keep-${gi}" value="${ci}" ${ci===defaultIdx?'checked':''}></td>
        <td>${esc(c.numeroContrato)||'(sem número)'}</td>
        <td>${esc(c.credor)||'—'}</td>
        <td class="num">${fmtMoney(c.valorInicial)}</td>
        <td class="num">${empCount} empenho(s)</td>
      </tr>`;
    }).join('');
    return `<div class="subcard">
      <b>${esc(grp[0].numeroContrato)||'(sem número)'}</b> <span class="small-muted">— ${grp.length} cópias encontradas, escolha qual manter</span>
      <div class="table-wrap" style="margin-top:8px;"><table class="dt">
        <thead><tr><th>Manter</th><th>Contrato</th><th>Credor</th><th class="num">Valor</th><th class="num">Empenhos lançados</th></tr></thead>
        <tbody>${rows}</tbody>
      </table></div>
    </div>`;
  }).join('');
  openModal('Contratos duplicados encontrados',
    `<p style="margin-top:0;font-size:13px;color:var(--ink-2);">Marcamos como sugestão a cópia com mais empenhos lançados (provavelmente a mais completa). Confira antes de excluir — a ação não pode ser desfeita.</p>${html}`,
    `<button class="btn" onclick="closeModal()">Cancelar</button><button class="btn-danger" onclick="duplicadosResolver()">Excluir as demais cópias</button>`, true);
}
async function duplicadosResolver(){
  let removed = 0;
  const idsToDelete = [];
  __DUP_GROUPS__.forEach((grp,gi)=>{
    const radios = document.getElementsByName('dup-keep-'+gi);
    let keepIdx = 0;
    radios.forEach(r=>{ if(r.checked) keepIdx = parseInt(r.value,10); });
    grp.forEach((c,ci)=>{
      if(ci!==keepIdx){ idsToDelete.push(c.id); removed++; }
    });
  });
  DB.contratos = DB.contratos.filter(c=>!idsToDelete.includes(c.id));
  closeModal();
  toast(removed + ' cópia(s) duplicada(s) removida(s).');
  goDashboard();
  for(const id of idsToDelete){ await dbDelete('emp_contratos', id); }
}

/* ---------- Aditivos ---------- */
async function aditivoAdicionarInline(contratoId){
  const c = DB.contratos.find(x=>x.id===contratoId);
  if(!c.aditivos) c.aditivos=[];
  const ordem = c.aditivos.length;
  const newId = await dbInsert('emp_aditivos', {contrato_id:contratoId, label:'', data:'', valor:null, observacao:'', ordem});
  c.aditivos.push({id:newId, label:'', data:'', valor:undefined, observacao:''});
  render();
}
async function aditivoSetField(contratoId, aditivoId, field, value){
  const c = DB.contratos.find(x=>x.id===contratoId);
  const a = c.aditivos.find(x=>x.id===aditivoId);
  a[field] = (field==='valor') ? (value===''?undefined:toNumSafe(value)) : value;
  render();
  await dbUpdate('emp_aditivos', aditivoId, {[field]: field==='valor' ? (a.valor===undefined?null:a.valor) : value});
}
function aditivoExcluir(contratoId, aditivoId){
  const c = DB.contratos.find(x=>x.id===contratoId);

    c.aditivos = c.aditivos.filter(x=>x.id!==aditivoId);
    render();
    await dbDelete('emp_aditivos', aditivoId);
  });
}

  }).join('') || `<div class="note-box">Nenhuma medição lançada ainda. Clique em "+ Nova medição" — normalmente cada medição reúne várias notas fiscais.</div>`;

    <p style="margin-top:0;font-size:13px;color:var(--ink-2);">Empenho <b>${esc(e.numero)||'(sem número)'}</b> — Valor: <b>${fmtMoney(e.valor)}</b></p>
    <div class="grid cols-3" style="margin-bottom:4px;">
      ${kpi('Utilizado', fmtMoney(util), 'amber')}
      ${kpi('Saldo do empenho', fmtMoney(saldo), saldo<0?'red':'green')}
      ${kpi('Financeiro pago', fmtMoney(pago), '')}
    </div>
    ${medicoesHtml}
    <div style="margin-top:14px;"><button class="btn-primary" onclick="medicaoAdicionarInline('${contratoId}','${grupoId}','${empenhoId}')">+ Nova medição</button></div>
  `;
  if(isOpen){
    openModal('Notas fiscais — Empenho '+(e.numero||''), body, `<button class="btn-primary" onclick="closeModal();render();">Fechar</button>`, true);
  } else {
    document.getElementById('modal-body').innerHTML = body;
  }
}
async function medicaoAdicionarInline(contratoId, grupoId, empenhoId){
  const c = DB.contratos.find(x=>x.id===contratoId);
  const g = c.grupos.find(x=>x.id===grupoId);
  const e = g.empenhos.find(x=>x.id===empenhoId);
  if(!e.medicoes) e.medicoes=[];
  const numero = String(e.medicoes.length+1);
  const medId = await dbInsert('emp_medicoes', {empenho_id:empenhoId, numero, data:'', observacao:'', ordem:e.medicoes.length});
  const notaId = await dbInsert('emp_notas', {medicao_id:medId, nf:'', local:'', sgd:'', status:'PAGO', valor_nf:0, ordem:0});
  e.medicoes.push({id:medId, numero, data:'', observacao:'', notas:[{id:notaId, nf:'',local:'',sgd:'',status:'PAGO',valorNF:0}]});
  renderEmpenhoModalContent(contratoId, grupoId, empenhoId, false);
}
async function medicaoSetField(contratoId, grupoId, empenhoId, medicaoId, field, value){
  const c = DB.contratos.find(x=>x.id===contratoId);
  const g = c.grupos.find(x=>x.id===grupoId);
  const e = g.empenhos.find(x=>x.id===empenhoId);
  const m = e.medicoes.find(x=>x.id===medicaoId);
  m[field] = value;
  renderEmpenhoModalContent(contratoId, grupoId, empenhoId, false);
  await dbUpdate('emp_medicoes', medicaoId, {[field]: value});
}
function medicaoExcluir(contratoId, grupoId, empenhoId, medicaoId){
  const c = DB.contratos.find(x=>x.id===contratoId);
  const g = c.grupos.find(x=>x.id===grupoId);
  const e = g.empenhos.find(x=>x.id===empenhoId);
  confirmAction('Excluir esta medição e todas as suas notas fiscais?', async ()=>{
    e.medicoes = e.medicoes.filter(m=>m.id!==medicaoId);
    renderEmpenhoModalContent(contratoId, grupoId, empenhoId, false);
    await dbDelete('emp_medicoes', medicaoId);
  });
}
async function notaAdicionarInline(contratoId, grupoId, empenhoId, medicaoId){
  const c = DB.contratos.find(x=>x.id===contratoId);
  const g = c.grupos.find(x=>x.id===grupoId);
  const e = g.empenhos.find(x=>x.id===empenhoId);
  const m = e.medicoes.find(x=>x.id===medicaoId);
  if(!m.notas) m.notas=[];
  // repete local/SGD/status da última nota da medição, pois normalmente pertencem ao mesmo lote
  const last = m.notas[m.notas.length-1] || {local:'',sgd:'',status:'PAGO'};
  const newId = await dbInsert('emp_notas', {medicao_id:medicaoId, nf:'', local:last.local, sgd:last.sgd, status:last.status, valor_nf:0, ordem:m.notas.length});
  m.notas.push({id:newId, nf:'', local:last.local, sgd:last.sgd, status:last.status, valorNF:0});
  renderEmpenhoModalContent(contratoId, grupoId, empenhoId, false);
}
async function notaSetField(contratoId, grupoId, empenhoId, medicaoId, notaId, field, value){
  const c = DB.contratos.find(x=>x.id===contratoId);
  const g = c.grupos.find(x=>x.id===grupoId);
  const e = g.empenhos.find(x=>x.id===empenhoId);
  const m = e.medicoes.find(x=>x.id===medicaoId);
  const n = m.notas.find(x=>x.id===notaId);
  n[field] = (field==='valorNF') ? toNumSafe(value) : value;
  renderEmpenhoModalContent(contratoId, grupoId, empenhoId, false);
  const colMap = {nf:'nf', local:'local', sgd:'sgd', status:'status', valorNF:'valor_nf'};
  await dbUpdate('emp_notas', notaId, {[colMap[field]]: n[field]});
}
function notaExcluir(contratoId, grupoId, empenhoId, medicaoId, notaId){
  const c = DB.contratos.find(x=>x.id===contratoId);
  const g = c.grupos.find(x=>x.id===grupoId);
  const e = g.empenhos.find(x=>x.id===empenhoId);
  const m = e.medicoes.find(x=>x.id===medicaoId);
  m.notas = m.notas.filter(x=>x.id!==notaId);
  renderEmpenhoModalContent(contratoId, grupoId, empenhoId, false);
  dbDelete('emp_notas', notaId);
}
/* =========================================================================
   IMPORTAÇÃO DA PLANILHA DE CONTRATOS (com prévia editável antes de confirmar)
   ========================================================================= */
let IMPORT_PARSED = [];
function importarExcelArquivo(file){
  const reader = new FileReader();
  reader.onload = e=>{
    try{
      const data = new Uint8Array(e.target.result);
      const wb = XLSX.read(data, {type:'array'});
      IMPORT_PARSED = ContratoParser.parseWorkbook(XLSX, wb);
      renderImportWizard();
    }catch(err){ toast('Não foi possível ler o arquivo Excel.', true); console.error(err); }
  };
  reader.readAsArrayBuffer(file);
}
function renderImportWizard(){
  const html = `
    <div class="note-box" style="margin-bottom:14px;">
      Foram lidas ${IMPORT_PARSED.length} aba(s). Os dados de <b>credor, CNPJ, contrato, vigência e valor</b> costumam ser identificados com segurança.
      Já os <b>empenhos</b> variam de formato entre as abas — revise a lista antes de confirmar e apague linhas que não sejam empenhos de verdade (ex.: "SALDO DE EMPENHO", cabeçalhos repetidos).
      Contratos que já existem no sistema aparecem marcados em vermelho e não serão importados de novo, mesmo que você importe a mesma planilha várias vezes.
    </div>
    <div id="import-list">${IMPORT_PARSED.map((c,ci)=>renderImportCard(c,ci)).join('')}</div>
  `;
  openModal('Importar planilha de contratos', html,
    `<button class="btn" onclick="closeModal()">Cancelar</button><button class="btn-primary" onclick="confirmarImportacaoTodos()">Importar contratos marcados</button>`, true);
}
function renderImportCard(c, ci){
  const empRows = [];
  (c.grupos||[]).forEach((g,gi)=>{
    (g.empenhos||[]).forEach((e,ei)=>{
      const soma = (e.notas||[]).reduce((s,n)=>s+toNum(n.valorNF),0);
      empRows.push(`<tr data-ci="${ci}" data-gi="${gi}" data-ei="${ei}">
        <td><input value="${esc(g.tipo)}" style="width:110px;" onchange="IMPORT_PARSED[${ci}].grupos[${gi}].tipo=this.value"></td>
        <td><input value="${esc(e.numero)}" style="width:150px;" onchange="IMPORT_PARSED[${ci}].grupos[${gi}].empenhos[${ei}].numero=this.value"></td>
        <td><input type="number" step="0.01" value="${e.valor||0}" style="width:100px;" onchange="IMPORT_PARSED[${ci}].grupos[${gi}].empenhos[${ei}].valor=parseFloat(this.value)||0"></td>
        <td class="num">${fmtMoney(soma)} (${(e.notas||[]).length} NF)</td>
        <td class="row-actions"><button class="btn-sm btn-danger" type="button" onclick="importRemoverEmpenho(${ci},${gi},${ei}, this)">remover</button></td>
      </tr>`);
    });
  });
  const jaExiste = contratoJaExiste(c);
  return `<div class="card" style="margin-bottom:14px;" id="import-card-${ci}">
    <div class="flex-between">
      <label style="display:flex;align-items:center;gap:8px;font-weight:700;font-size:14px;">
        <input type="checkbox" id="import-check-${ci}" ${(c.credor && c.credor!=='xxxxxx' && !jaExiste) ? 'checked':''} ${jaExiste?'disabled':''}>
        ${esc(c.numeroContrato)||'(sem número — aba: '+esc(c.nomeAba)+')'}
      </label>
      ${jaExiste?'<span class="tag red">Este contrato já existe no sistema — não será importado de novo</span>':''}
    </div>
    <div class="form-grid" style="margin-top:10px;">
      <div class="field"><label>Credor</label><input id="import-credor-${ci}" value="${esc(c.credor)}"></div>
      <div class="field"><label>CNPJ</label><input id="import-cnpj-${ci}" value="${esc(c.cnpj)}"></div>
      <div class="field"><label>Vigência inicial</label><input id="import-vig-${ci}" value="${esc(toDateBR(c.vigenciaInicial))}"></div>
      <div class="field"><label>Valor do contrato (R$)</label><input type="number" step="0.01" id="import-valor-${ci}" value="${c.valorInicial}"></div>
    </div>
    ${empRows.length ? `<div class="table-wrap" style="margin-top:10px;"><table class="dt">
      <thead><tr><th>Categoria</th><th>Nº do empenho</th><th class="num">Valor</th><th class="num">Soma das NFs</th><th></th></tr></thead>
      <tbody>${empRows.join('')}</tbody></table></div>` : '<p class="small-muted" style="margin-top:10px;">Nenhum empenho identificado automaticamente nesta aba — você poderá lançá-los manualmente depois de importar.</p>'}
  </div>`;
}
function importRemoverEmpenho(ci,gi,ei, btn){
  IMPORT_PARSED[ci].grupos[gi].empenhos.splice(ei,1);
  btn.closest('tr').remove();
}
async function pushContratoTree(c){
  const contratoId = await dbInsert('emp_contratos', {
    credor:c.credor||'', cnpj:c.cnpj||'', numero_contrato:c.numeroContrato||'', objeto:c.objeto||'',
    vigencia_inicial:c.vigenciaInicial||'', valor_inicial:toNum(c.valorInicial)
  });
  const aditivosOut = [];
  for(let i=0;i<(c.aditivos||[]).length;i++){
    const a = c.aditivos[i];
    const aid = await dbInsert('emp_aditivos', {contrato_id:contratoId, label:a.label||'', data:a.data||'', valor:(a.valor===undefined||a.valor===null||a.valor==='')?null:toNum(a.valor), observacao:a.observacao||'', ordem:i});
    aditivosOut.push({id:aid, label:a.label, data:a.data, valor:a.valor, observacao:a.observacao});
  }
  const gruposOut = [];
  const grupos = (c.grupos||[]).filter(g=>(g.empenhos||[]).length>0);
  for(let gi=0; gi<grupos.length; gi++){
    const g = grupos[gi];
    const grupoId = await dbInsert('emp_grupos', {contrato_id:contratoId, tipo:g.tipo, ordem:gi});
    const empenhosOut = [];
    for(let ei=0; ei<g.empenhos.length; ei++){
      const e = g.empenhos[ei];
      const empenhoId = await dbInsert('emp_empenhos', {grupo_id:grupoId, numero:e.numero||'', data_emissao:e.dataEmissao||'', valor:toNum(e.valor), status_override:e.statusOverride||'', ordem:ei});
      const medicoesOut = [];
      const medicoesSrc = e.medicoes && e.medicoes.length ? e.medicoes : (e.notas && e.notas.length ? [{numero:'1', data:'', observacao:'Importado', notas:e.notas}] : []);
      for(let mi=0; mi<medicoesSrc.length; mi++){
        const m = medicoesSrc[mi];
        const medId = await dbInsert('emp_medicoes', {empenho_id:empenhoId, numero:m.numero||'1', data:m.data||'', observacao:m.observacao||'', ordem:mi});
        const notasOut = [];
        for(let ni=0; ni<(m.notas||[]).length; ni++){
          const n = m.notas[ni];
          const notaId = await dbInsert('emp_notas', {medicao_id:medId, nf:n.nf||'', local:n.local||'', sgd:n.sgd||'', status:n.status||'', valor_nf:toNum(n.valorNF), ordem:ni});
          notasOut.push({id:notaId, nf:n.nf, local:n.local, sgd:n.sgd, status:n.status, valorNF:toNum(n.valorNF)});
        }
        medicoesOut.push({id:medId, numero:m.numero, data:m.data, observacao:m.observacao, notas:notasOut});
      }
      empenhosOut.push({id:empenhoId, numero:e.numero, dataEmissao:e.dataEmissao, valor:toNum(e.valor), statusOverride:e.statusOverride||'', medicoes:medicoesOut});
    }
    gruposOut.push({id:grupoId, tipo:g.tipo, empenhos:empenhosOut});
  }
  return {id:contratoId, credor:c.credor, cnpj:c.cnpj, numeroContrato:c.numeroContrato, objeto:c.objeto||'',
    vigenciaInicial:c.vigenciaInicial, valorInicial:toNum(c.valorInicial), aditivos:aditivosOut, grupos:gruposOut};
}
async function confirmarImportacaoTodos(){
  let count = 0, skippedDup = 0;
  const usedKeysThisBatch = new Set(DB.contratos.map(contratoKey));
  const toImport = [];
  IMPORT_PARSED.forEach((c,ci)=>{
    const chk = document.getElementById('import-check-'+ci);
    if(!chk || !chk.checked) return;
    const credor = document.getElementById('import-credor-'+ci).value;
    const cnpj = document.getElementById('import-cnpj-'+ci).value;
    const vig = document.getElementById('import-vig-'+ci).value;
    const valor = toNumSafe(document.getElementById('import-valor-'+ci).value);
    const keyCandidate = contratoKey({numeroContrato:c.numeroContrato, credor, valorInicial: valor});
    if(usedKeysThisBatch.has(keyCandidate)){ skippedDup++; return; }
    usedKeysThisBatch.add(keyCandidate);
    toImport.push(Object.assign({}, c, {credor, cnpj, vigenciaInicial:vig, valorInicial:valor}));
  });
  closeModal();
  if(toImport.length) toast('Importando '+toImport.length+' contrato(s)... aguarde.');
  for(const c of toImport){
    const novo = await pushContratoTree(c);
    DB.contratos.push(novo);
    count++;
  }
  toast(count + ' contrato(s) importado(s).' + (skippedDup? ' '+skippedDup+' duplicado(s) da mesma importação foram ignorados.' : ''));
  goDashboard();
}

/* =========================================================================
   BACKUP JSON
   ========================================================================= */
function exportarBackupJSON(){
  const blob = new Blob([JSON.stringify({contratos:DB.contratos},null,2)], {type:'application/json'});
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'controle_empenhos_backup.json'; a.click();
  toast('Backup exportado.');
}
function importarBackupJSON(file){
  const reader = new FileReader();
  reader.onload = async e=>{
    try{
      const parsed = JSON.parse(e.target.result);
      const contratosBackup = parsed.contratos || [];
      const usedKeys = new Set(DB.contratos.map(contratoKey));
      const toImport = contratosBackup.filter(c=>{
        const k = contratoKey(c);
        if(usedKeys.has(k)) return false;
        usedKeys.add(k); return true;
      });
      if(!toImport.length){ toast('Nenhum contrato novo encontrado no backup (todos já existem).'); return; }
      toast('Restaurando '+toImport.length+' contrato(s) do backup... aguarde.');
      for(const c of toImport){
        const novo = await pushContratoTree(c);
        DB.contratos.push(novo);
      }
      toast('Backup importado.'); goDashboard();
    }catch(err){ toast('Arquivo de backup inválido.', true); console.error(err); }
  };
  reader.readAsText(file);
}
